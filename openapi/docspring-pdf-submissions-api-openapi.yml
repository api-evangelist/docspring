                type: object
                properties:
                  submissions:
                    type: array
                    items:
                      $ref: '#/components/schemas/submission'
                  limit:
                    type: integer
                  next_cursor:
                    type: string
                    nullable: true
                required:
                - submissions
                - limit
                - next_cursor
                additionalProperties: false
              example:
                submissions:
                - batch_id: null
                  data_requests: []
                  editable: false
