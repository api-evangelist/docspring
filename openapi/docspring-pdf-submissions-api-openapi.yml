        '401':
          description: authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                status: error
                error: 'Missing Basic Auth: Please provide an API token via Basic Auth. See: https://docspring.com/docs/api-guide/authentication/'
      description: 'Returns a paginated list of all PDF submissions across all templates in your account.

        Can be filtered by date range and submission type (test/live). Supports cursor-based

        pagination and optionally includes submission data for each result.

        '
      parameters:
      - name: cursor
        in: query
        type: string
        required: false
        x-example: sub_1234567890abcdef12
      - name: limit
        in: query
        type: integer
        required: false
        x-example: 3
      - name: created_after
        in: query
        type: string
        required: false
        x-example: '2019-01-01T09:00:00-05:00'
      - name: created_before
        in: query
        type: string
        required: false
        x-example: 2020-01-01T09:00:00.000+0200
      - name: type
        in: query
        type: string
        required: false
        x-example: test
      - name: include_data
        in: query
        type: boolean
        x-example: true
      security:
      - basicAuth: []
