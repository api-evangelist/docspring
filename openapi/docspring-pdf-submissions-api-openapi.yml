openapi: 3.0.3
info:
  title: DocSpring Authentication PDF Submissions API
  description: Use DocSpring's API to programmatically fill out PDF forms, convert HTML to PDFs, merge PDFs, or request legally binding e-signatures.
  version: v1
  contact:
    url: https://docspring.com/docs/
  license:
    name: Proprietary
servers:
- url: https://sync.api.docspring.com/api/v1
  description: DocSpring API
security:
- basicAuth: []
tags:
- name: PDF Submissions
paths:
  /templates/{template_id}/submissions:
    post:
      operationId: generatePdf
      summary: Generate a PDF
      tags:
      - PDF Submissions
      responses:
        '201':
          description: submission created
          content:
            application/json:
              schema:
                type: object
                title: create_submission_response
                properties:
                  status:
                    type: string
                    enum:
                    - success
                    - error
                  submission:
                    $ref: '#/components/schemas/submission_preview'
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - status
                - submission
                additionalProperties: false
              example:
                status: success
                submission:
                  batch_id: null
                  data_requests:
                  - id: drq_1234567890abcdef01
                    email: jsmith@example.com
                    name: null
                    order: 0
                    sort_order: 0
                    fields: null
                    metadata: {}
                    state: pending
                    viewed_at: null
                    completed_at: null
                    data: null
                    auth_type: email_link
                    auth_second_factor_type: none
                    auth_provider: null
                    auth_session_started_at: null
                    auth_session_id_hash: null
                    auth_user_id_hash: null
                    auth_username_hash: null
                    auth_phone_number_hash: null
                    ip_address: null
                    user_agent: null
                  editable: null
                  error_message: null
                  expired: false
                  expires_at: null
                  id: sub_1234567890abcdef01
                  json_schema_errors: []
                  metadata:
                    foo: 123
                    bar: baz
                  password: null
                  processed_at: null
                  state: waiting_for_data_requests
                  template_id: tpl_1234567890abcdef02
                  template_type: pdf
                  template_version: null
                  test: false
                  truncated_text: {}
                  pdf_hash: null
                  download_url: null
                  permanent_download_url: null
                  preview_download_url: null
                  preview_generated_at: null
                  audit_trail_download_url: null
                  actions: []
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/submission_422_response'
                type: object
                title: create_submission_response
                properties:
                  status:
                    type: string
                    enum:
                    - success
                    - error
                  submission:
                    $ref: '#/definitions/submission_preview'
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - status
                - submission
                additionalProperties: false
              example:
                status: error
                error: 'Invalid field_overrides. Fields do not exist for this template: ''non_existent'''
                submission:
                  batch_id: null
                  data_requests: []
                  editable: null
                  error_message: null
                  expired: false
                  expires_at: null
                  id: sub_1234567890abcdef01
                  json_schema_errors:
                  - The object did not contain a required property of 'last_name'
                  metadata:
                    foo: 123
                    bar: baz
                  password: null
                  processed_at: null
                  state: invalid_data
                  template_id: tpl_1234567890abcdef01
                  template_type: pdf
                  template_version: null
                  test: false
                  truncated_text: {}
                  pdf_hash: null
                  download_url: null
                  permanent_download_url: null
                  preview_download_url: null
                  preview_generated_at: null
                  audit_trail_download_url: null
                  actions: []
                errors:
                - The object did not contain a required property of 'last_name'
        '401':
          description: authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                status: error
                error: Invalid API token secret
      description: 'Creates a PDF submission by filling in a template with data. Supports both synchronous (default) and

        asynchronous processing. Set `wait: false` to return immediately.


        See also:

        - [Customize the PDF Title and Filename](https://docspring.com/docs/api-guide/generate-pdfs/customize-pdf-title-and-filename/) - Set custom metadata

        - [Handling Truncated Text](https://docspring.com/docs/api-guide/generate-pdfs/handle-truncated-text/) - Handle text that doesn''t fit in fields

        '
      externalDocs:
        url: https://docspring.com/docs/api-guide/generate-pdfs/generate-pdfs-via-api/
        description: Complete guide to generating PDFs with DocSpring
      parameters:
      - name: template_id
        in: path
        type: string
        required: true
        x-example: tpl_1234567890abcdef01
      - name: wait
        in: query
        type: boolean
        default: true
        required: false
        description: 'Wait for submission to be processed before returning. Set to false to return immediately. Default: true (on sync.* subdomain)'
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                data:
                  title: submission_data
                  type: object
                data_requests:
                  items:
                    properties:
                      auth_phone_number_hash:
                        type:
                        - string
                        - 'null'
                      auth_provider:
                        type:
                        - string
                        - 'null'
                      auth_second_factor_type:
                        enum:
                        - none
                        - phone_number
                        - totp
                        - mobile_push
                        - security_key
                        - fingerprint
                        type: string
                      auth_session_id_hash:
                        type:
                        - string
                        - 'null'
                      auth_session_started_at:
                        type:
                        - string
                        - 'null'
                      auth_type:
                        enum:
                        - none
                        - password
                        - oauth
                        - email_link
                        - phone_number
                        - ldap
                        - saml
                        type: string
                      auth_user_id_hash:
                        type:
                        - string
                        - 'null'
                      auth_username_hash:
                        type:
                        - string
                        - 'null'
                      email:
                        type:
                        - string
                        - 'null'
                      fields:
                        items:
                          type:
                          - string
                          - 'null'
                        type: array
                      metadata:
                        type: object
                      name:
                        type:
                        - string
                        - 'null'
                      order:
                        type: integer
                      skipped:
                        type:
                        - boolean
                        - 'null'
                    title: create_submission_data_request_data
                    type:
                    - object
                    - 'null'
                  type: array
                editable:
                  type: boolean
                expires_in:
                  type: integer
                field_overrides:
                  title: submission_field_overrides
                  type: object
                metadata:
                  title: submission_metadata
                  type: object
                password:
                  type: string
                test:
                  type: boolean
                version:
                  type: string
              required:
              - data
              title: create_pdf_submission_data
              type: object
              example:
                version: draft
                data:
                  first_name: John
                  last_name: Smith
                  phone_number: '+11234567890'
                metadata:
                  foo: 123
                  bar: baz
                expires_in: 300
        required: true
      security:
      - basicAuth: []
    get:
      operationId: listTemplateSubmissions
      summary: List all submissions for a given template
      tags:
      - PDF Submissions
      responses:
        '200':
          description: listing submissions
          content:
            application/json:
              schema:
